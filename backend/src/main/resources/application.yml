spring:
  application:
    name: island-delta-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/islanddelta;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

island-delta:
  nlp-service-url: ${NLP_SERVICE_URL:http://127.0.0.1:8000}
  admin-jwt-secret: ${ADMIN_JWT_SECRET:island-delta-admin-secret-key-2026}
  admin-jwt-expiration-hours: 24
